<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة فرعون</title>
    <style>
        body { margin: 0; background-color: #0e1621; color: white; font-family: sans-serif; overflow: hidden; }

        /* شاشة الصورة الافتتاحية */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 1s ease-out;
        }

        #splash-screen img {
            width: 250px; /* تقدر تكبر أو تصغر الصورة من هنا */
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(80, 163, 42, 0.5);
        }

        /* المحتوى اللي هيظهر بعد الصورة */
        .main-content {
            display: none; /* مخفي في البداية */
            padding: 20px;
            text-align: center;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة البداية (الصورة) -->
    <div id="splash-screen">
        <!-- هنا بنادي على الصورة اللي إنت رفعتها بنفس اسمها بالظبط -->
        <img src="1772926951055.png" alt="Logo">
    </div>

    <!-- 2. محتوى الموقع الأساسي -->
    <div class="main-content" id="content">
        <h1>أهلاً بك في منصة فرعون 👑</h1>
        <p>الموقع جاهز وبدأنا بأول خطوة وهي صورة البداية.</p>
    </div>

    <script>
        // كود التحكم في ظهور وإخفاء الصورة
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const content = document.getElementById('content');
            
            splash.style.opacity = '0'; // تبدأ تختفي بالتدريج
            
            setTimeout(() => {
                splash.style.display = 'none'; // تختفي تماماً
                content.style.display = 'block'; // يظهر الموقع
                document.body.style.overflow = 'auto'; // السماح بالتحرك في الصفحة
            }, 1000); // وقت التلاشي
        }, 3000); // الصورة هتفضل ظاهرة 3 ثواني
    </script>

</body>
</html>
